<text x="24.0" y="378.6" font-size="13" fill="#1a1a1a">• Chuẩn: 802.11g Ad-hoc (AdhocWifiMac)</text>
<text x="24.0" y="394.8" font-size="13" fill="#1a1a1a">• Tốc độ: ErpOfdmRate6Mbps</text>
<text x="24.0" y="411.1" font-size="13" fill="#1a1a1a">• Suy hao: LogDistance (n = 3.0, L0 =</text>
<text x="34.8" y="427.3" font-size="13" fill="#1a1a1a">40.046 dB)</text>
<text x="24.0" y="443.6" font-size="13" fill="#1a1a1a">• Fading: Nakagami (m = 1.5)</text>
<text x="24.0" y="459.8" font-size="13" fill="#1a1a1a">• Ngưỡng thu: -82 dBm</text>
<text x="24.0" y="476.1" font-size="13" fill="#1a1a1a">• Trễ truyền sóng: ConstantSpeed</text>
<text x="24.0" y="492.3" font-size="13" fill="#1a1a1a">• Khoảng cách đo: d = 10 đến 100 m</text>
<text x="24.0" y="508.6" font-size="13" fill="#1a1a1a">• Gửi lại MAC: tối đa 7 lần; hàng đợi 500</text>
<text x="34.8" y="524.8" font-size="13" fill="#1a1a1a">gói, MaxDelay 500 ms</text>
