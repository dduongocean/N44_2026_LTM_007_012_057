<text x="454.9" y="556.8" font-size="13" fill="#1a1a1a">lost_events += 1</text>
<rect x="400.0" y="620.4" width="205.0" height="64.8" rx="4.0" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="417.0" y="641.2" font-size="13" fill="#1a1a1a">Gửi TIMESYNC tc1 = 0, ts1 =</text>
