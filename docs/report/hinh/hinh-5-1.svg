<text x="58.0" y="458.1" font-size="13" fill="#1a1a1a">IntervalStats ghi khoảng</text>
<text x="94.3" y="474.3" font-size="13" fill="#1a1a1a">cách 2 nhịp</text>
<rect x="235.0" y="404.8" width="175.0" height="81.0" rx="4.0" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="260.5" y="433.7" font-size="13" fill="#1a1a1a">Bản tin bất kỳ của xe:</text>
<text x="255.2" y="449.9" font-size="13" fill="#1a1a1a">SeqTracker.on_packet(</text>
<text x="288.3" y="466.2" font-size="13" fill="#1a1a1a">nguồn, seq)</text>
<rect x="430.0" y="404.8" width="175.0" height="81.0" rx="4.0" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="457.2" y="425.6" font-size="13" fill="#1a1a1a">TIMESYNC phản hồi</text>
<text x="492.0" y="441.8" font-size="13" fill="#1a1a1a">(tc1 ≠ 0):</text>
<text x="449.5" y="458.1" font-size="13" fill="#1a1a1a">RttTracker.on_reply(mã</text>
<text x="467.2" y="474.3" font-size="13" fill="#1a1a1a">probe = ts1, now)</text>
<polygon points="78.0,519.8 312.0,519.8 330.0,552.1 312.0,584.5 78.0,584.5 60.0,552.1" fill="#e3eef9" stroke="#2b6cb0" stroke-width="1.2"/>
<text x="133.5" y="540.6" font-size="13" fill="#1a1a1a">(2) Trạng thái chuyển</text>
<text x="133.4" y="556.8" font-size="13" fill="#1a1a1a">sang LOST? (quá 3 s</text>
<text x="125.7" y="573.1" font-size="13" fill="#1a1a1a">không có HEARTBEAT)</text>
<polygon points="78.0,628.5 312.0,628.5 330.0,652.8 312.0,677.0 78.0,677.0 60.0,652.8" fill="#e3eef9" stroke="#2b6cb0" stroke-width="1.2"/>
<text x="130.2" y="649.3" font-size="13" fill="#1a1a1a">(3) Đến lúc gửi probe?</text>
<text x="132.3" y="665.6" font-size="13" fill="#1a1a1a">(mỗi 1/probe_hz giây)</text>
<rect x="60.0" y="721.0" width="270.0" height="48.5" rx="4.0" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="117.6" y="741.8" font-size="13" fill="#1a1a1a">(4) RttTracker.expire(now):</text>
<text x="110.5" y="758.1" font-size="13" fill="#1a1a1a">probe chờ quá 2 s tính là mất</text>
<polygon points="78.0,795.5 312.0,795.5 330.0,811.6 312.0,827.8 78.0,827.8 60.0,811.6" fill="#e3eef9" stroke="#2b6cb0" stroke-width="1.2"/>
<text x="133.1" y="816.3" font-size="13" fill="#1a1a1a">(5) Tròn thêm 1 giây?</text>
<rect x="60.0" y="871.8" width="270.0" height="32.2" rx="4.0" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
