<text x="81.3" y="284.8" font-size="13" fill="#1a1a1a">(1) poll(): đọc mọi bản tin đang chờ trên</text>
<text x="176.2" y="301.1" font-size="13" fill="#1a1a1a">socket</text>
<polygon points="78.0,338.5 312.0,338.5 330.0,354.6 312.0,370.8 78.0,370.8 60.0,354.6" fill="#e3eef9" stroke="#2b6cb0" stroke-width="1.2"/>
<text x="156.1" y="359.3" font-size="13" fill="#1a1a1a">Loại sự kiện?</text>
