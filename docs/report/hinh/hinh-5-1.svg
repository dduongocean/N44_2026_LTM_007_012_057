<text x="78.0" y="95.3" font-size="13" fill="#1a1a1a">Mở socket MAVLink udpin:0.0.0.0:14540</text>
<text x="75.8" y="111.6" font-size="13" fill="#1a1a1a">Tạo LinkMonitor, SeqTracker, RttTracker,</text>
<text x="158.9" y="127.8" font-size="13" fill="#1a1a1a">IntervalStats</text>
<text x="84.7" y="144.1" font-size="13" fill="#1a1a1a">Ghi phần đầu file data/raw/&lt;label&gt;.csv</text>
